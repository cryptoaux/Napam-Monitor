<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAPAMS Monitor</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6fa;
      color: #1f2937;
    }
    .header {
      background: white;
      padding: 35px 7%;
      border-bottom: 1px solid #e5e7eb;
    }
    .header h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 800;
    }
    .header p {
      margin: 12px 0 0;
      color: #6b7280;
      font-size: 21px;
    }
    .container {
      width: 86%;
      max-width: 1200px;
      margin: 35px auto;
    }
    /* SEARCH */
    .search-container {
      margin-bottom: 30px;
      position: relative;
    }
    .search-box {
      width: 100%;
      background: white;
      border: 1px solid #d9dee7;
      border-radius: 18px;
      padding: 18px 20px 18px 52px;
      font-size: 17px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.10);
    }
    .search-icon {
      position: absolute;
      left: 19px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 21px;
      color: #6b7280;
      pointer-events: none;
    }
    .clear-search {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: #eef1f5;
      color: #4b5563;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .clear-search:hover {
      background: #e1e5eb;
    }
    .search-result-info {
      margin-top: 10px;
      color: #6b7280;
      font-size: 14px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
      margin-bottom: 35px;
    }
    .summary-card {
      background: white;
      border: 1px solid #e1e5eb;
      border-radius: 22px;
      padding: 30px;
    }
    .summary-title {
      color: #6b7280;
      font-size: 18px;
      margin-bottom: 18px;
    }
    .summary-number {
      font-size: 48px;
      font-weight: 800;
    }
    /* COMPANY */
    .company-card {
      background: white;
      border: 1px solid #e1e5eb;
      border-radius: 24px;
      margin-bottom: 25px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
    }
    .company-header {
      width: 100%;
      padding: 25px 30px;
      border: none;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      text-align: left;
    }
    .company-header:hover {
      background: #fafbfc;
    }
    .company-title {
      font-size: 25px;
      font-weight: 800;
      text-transform: uppercase;
      color: #111827;
    }
    .company-meta {
      color: #6b7280;
      font-size: 15px;
      margin-top: 7px;
    }
    .company-arrow {
      font-size: 24px;
      color: #6b7280;
      transition: transform 0.2s ease;
    }
    .company-card.open .company-arrow {
      transform: rotate(180deg);
    }
    .company-applications {
      display: none;
      padding: 0 20px 20px;
    }
    .company-card.open .company-applications {
      display: block;
    }
    .application-card {
      background: #ffffff;
      border: 1px solid #e1e5eb;
      border-radius: 20px;
      padding: 25px;
      margin-top: 15px;
    }
    .application-name {
      font-size: 23px;
      font-weight: 800;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .application-number {
      color: #6b7280;
      font-size: 16px;
      margin-bottom: 20px;
    }
    .application-number strong {
      color: #374151;
    }
    .current-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 25px;
    }
    .current-status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .current-status-yellow {
      background: #fff0c2;
      color: #9a4d00;
    }
    .current-status-red {
      background: #ffe1e1;
      color: #b42323;
    }
    .current-status-green {
      background: #dff5df;
      color: #087508;
    }
    .status-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .stage-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      width: 100%;
      gap: 9px 0;
      overflow: hidden;
    }
    .stage-item {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      max-width: 100%;
    }
    .stage-connector {
      width: 22px;
      height: 2px;
      background: #d5dae1;
      margin: 0 6px;
      flex-shrink: 0;
    }
    .stage-dot {
      width: 23px;
      height: 23px;
      min-width: 23px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 9px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .stage-name {
      margin-left: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #4b5563;
      white-space: nowrap;
    }
    .green {
      background: #008000;
    }
    .yellow {
      background: #ffb629;
    }
    .red {
      background: #ff4d4d;
    }
    .no-results {
      background: white;
      border: 1px solid #e1e5eb;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      color: #6b7280;
    }
    .last-updated {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin: 35px 0;
    }
    .loading {
      background: white;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      color: #6b7280;
    }
    .error {
      background: #ffe1e1;
      color: #a00000;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
    }
    @media (max-width: 900px) {
      .summary {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 700px) {
      .header {
        padding: 25px 6%;
      }
      .header h1 {
        font-size: 31px;
      }
      .header p {
        font-size: 17px;
      }
      .container {
        width: 92%;
        margin-top: 25px;
      }
      .summary {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      .summary-card {
        padding: 23px;
      }
      .summary-number {
        font-size: 40px;
      }
      .search-box {
        font-size: 15px;
        padding: 16px 45px 16px 48px;
      }
      .company-header {
        padding: 22px;
      }
      .company-title {
        font-size: 20px;
      }
      .company-meta {
        font-size: 13px;
      }
      .company-applications {
        padding: 0 15px 15px;
      }
      .application-card {
        padding: 20px;
      }
      .application-name {
        font-size: 20px;
      }
      .application-number {
        font-size: 14px;
      }
      .current-status {
        font-size: 14px;
        padding: 10px 15px;
      }
      .status-title {
        font-size: 18px;
      }
      .stage-container {
        gap: 10px 0;
      }
      .stage-connector {
        width: 10px;
        margin: 0 4px;
      }
      .stage-dot {
        width: 22px;
        height: 22px;
        min-width: 22px;
        font-size: 8px;
      }
      .stage-name {
        font-size: 9px;
        margin-left: 4px;
      }
    }
    @media (max-width: 430px) {
      .stage-name {
        font-size: 8px;
      }
      .stage-dot {
        width: 20px;
        height: 20px;
        min-width: 20px;
      }
      .stage-connector {
        width: 7px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>NAPAMS Monitor</h1>
    <p>Application status dashboard</p>
  </div>
  <div class="container">
<div id="error"></div>
<!-- SEARCH -->
<div class="search-container">
  <span class="search-icon">🔎</span>
  <input
    type="search"
    id="productSearch"
    class="search-box"
    placeholder="Search for a product..."
    autocomplete="off"
  >
  <button
    type="button"
    id="clearSearch"
    class="clear-search"
    aria-label="Clear search"
  >
    ×
  </button>
  <div
    id="searchResultInfo"
    class="search-result-info"
  ></div>
</div>
<!-- SUMMARY -->
<div class="summary">
  <div class="summary-card">
    <div class="summary-title">
      Total Applications
    </div>
    <div
      class="summary-number"
      id="totalApplications"
    >
      0
    </div>
  </div>
  <div class="summary-card">
    <div class="summary-title">
      In Progress
    </div>
    <div
      class="summary-number"
      id="inProgress"
    >
      0
    </div>
  </div>
  <div class="summary-card">
    <div class="summary-title">
      Approved
    </div>
    <div
      class="summary-number"
      id="approved"
    >
      0
    </div>
  </div>
  <div class="summary-card">
    <div class="summary-title">
      Companies
    </div>
    <div
      class="summary-number"
      id="totalCompanies"
    >
      0
    </div>
  </div>
</div>
<div id="applications">
  <div class="loading">
    Loading applications...
  </div>
</div>
<div
  class="last-updated"
  id="lastUpdated"
>
  Loading latest update...
</div>
  </div>
  <script>
    const DATA_URL = "./data.json";
    /*
     * The website checks for new data every minute.
     * GitHub Actions is responsible for checking NAPAMS.
     */
    const REFRESH_INTERVAL = 60 * 1000;
    let allCompanies = [];
    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
    function colorClass(color) {
      if (
        String(color).toUpperCase() === "GREEN"
      ) {
        return "green";
      }
      if (
        String(color).toUpperCase() === "YELLOW"
      ) {
        return "yellow";
      }
      return "red";
    }
    function currentStatusClass(color) {
      if (
        String(color).toUpperCase() === "GREEN"
      ) {
        return "current-status-green";
      }
      if (
        String(color).toUpperCase() === "YELLOW"
      ) {
        return "current-status-yellow";
      }
      return "current-status-red";
    }
    function getCurrentStatusColor(app) {
      const stages =
        Array.isArray(app.stages)
          ? app.stages
          : [];
      const currentStatus =
        String(
          app.currentStatus || ""
        )
          .trim()
          .toLowerCase();
      const matchingStage =
        stages.find(
          (stage) =>
            String(
              stage.name ||
              stage.trackingStageName ||
              ""
            )
              .trim()
              .toLowerCase() ===
            currentStatus
        );
      if (matchingStage) {
        return (
          matchingStage.color ||
          "YELLOW"
        );
      }
      return (
        app.currentStatusColor ||
        "YELLOW"
      );
    }
    /*
     * Render one application card.
     */
    function renderApplication(app) {
      const stages =
        Array.isArray(app.stages)
          ? app.stages
          : [];
      const currentColor =
        getCurrentStatusColor(app);
      const card =
        document.createElement("div");
      card.className =
        "application-card";
      const stageHTML =
        stages
          .map(
            (stage, index) => {
              const stageColor =
                stage.color ||
                "RED";
              const cssColor =
                colorClass(stageColor);
              const stageName =
                stage.name ||
                stage.trackingStageName ||
                "Unknown";
              return `
                <div class="stage-item">
                  ${
                    index > 0
                      ? `<div class="stage-connector"></div>`
                      : ""
                  }
                  <div
                    class="stage-dot ${cssColor}"
                    title="${escapeHtml(stageName)}"
                  >
                    ${index + 1}
                  </div>
                  <div class="stage-name">
                    ${escapeHtml(stageName)}
                  </div>
                </div>
              `;
            }
          )
          .join("");
      const currentCss =
        currentStatusClass(
          currentColor
        );
      const currentDotClass =
        colorClass(currentColor);
      card.innerHTML = `
        <div class="application-name">
          ${escapeHtml(
            app.product ||
            app.name ||
            "Unknown Product"
          )}
        </div>
        <div class="application-number">
          Application Number:
          <strong>
            ${escapeHtml(
              app.applicationNumber ||
              "Unknown"
            )}
          </strong>
        </div>
        <div
          class="
            current-status
            ${currentCss}
          "
        >
          <span
            class="
              current-status-dot
              ${currentDotClass}
            "
          ></span>
          Current Status:
          <strong>
            ${escapeHtml(
              app.currentStatus ||
              "Unknown"
            )}
          </strong>
        </div>
        <div class="status-title">
          Status Stages
        </div>
        <div class="stage-container">
          ${stageHTML}
        </div>
      `;
      return card;
    }
    /*
     * Normalize company/application data.
     *
     * This supports the grouped format produced
     * by the current NAPAMS monitor.
     */
    function normalizeCompanies(data) {
      if (
        data &&
        Array.isArray(data.companies)
      ) {
        return data.companies;
      }
      /*
       * Backwards compatibility:
       * if data.json is still just an applications
       * array, place everything into one company.
       */
      if (Array.isArray(data)) {
        return [
          {
            id: "default_company",
            name: "Applications",
            applications: data
          }
        ];
      }
      if (
        data &&
        Array.isArray(data.applications)
      ) {
        return [
          {
            id: "default_company",
            name: "Applications",
            applications: data.applications
          }
        ];
      }
      return [];
    }
    /*
     * Render companies with their applications
     * grouped underneath each company.
     */
    function renderCompanies(companies) {
      const container =
        document.getElementById(
          "applications"
        );
      container.innerHTML = "";
      if (
        !Array.isArray(companies) ||
        companies.length === 0
      ) {
        container.innerHTML = `
          <div class="no-results">
            No submitted applications found.
          </div>
        `;
        return;
      }
      companies.forEach(
        (company, companyIndex) => {
          const applications =
            Array.isArray(
              company.applications
            )
              ? company.applications
              : [];
          if (
            applications.length === 0
          ) {
            return;
          }
          const companyCard =
            document.createElement(
              "div"
            );
          companyCard.className =
            "company-card";
          /*
           * Keep the first company open.
           * Other companies are collapsed.
           */
          if (companyIndex === 0) {
            companyCard.classList.add(
              "open"
            );
          }
          const companyHeader =
            document.createElement(
              "button"
            );
          companyHeader.type =
            "button";
          companyHeader.className =
            "company-header";
          companyHeader.innerHTML = `
            <div>
              <div class="company-title">
                ${escapeHtml(
                  company.name ||
                  "Unknown Company"
                )}
              </div>
              <div class="company-meta">
                ${applications.length}
                application${
                  applications.length === 1
                    ? ""
                    : "s"
                }
              </div>
            </div>
            <div class="company-arrow">
              ▼
            </div>
          `;
          companyHeader.addEventListener(
            "click",
            () => {
              companyCard.classList.toggle(
                "open"
              );
            }
          );
          const applicationsContainer =
            document.createElement(
              "div"
            );
          applicationsContainer.className =
            "company-applications";
          applications.forEach(
            (app) => {
              applicationsContainer.appendChild(
                renderApplication(app)
              );
            }
          );
          companyCard.appendChild(
            companyHeader
          );
          companyCard.appendChild(
            applicationsContainer
          );
          container.appendChild(
            companyCard
          );
        }
      );
      /*
       * If the search produced companies but
       * none had applications, show no results.
       */
      if (!container.children.length) {
        container.innerHTML = `
          <div class="no-results">
            No products found.
          </div>
        `;
      }
    }
    /*
     * Search products by name.
     *
     * Partial matching is supported.
     *
     * Example:
     * "bread"
     * will find:
     * "KASFOL FOODS AND CONFECTIONERIES BREAD"
     */
    function searchProducts() {
      const searchInput =
        document.getElementById(
          "productSearch"
        );
      const query =
        String(
          searchInput.value || ""
        )
          .trim()
          .toLowerCase();
      const clearButton =
        document.getElementById(
          "clearSearch"
        );
      const resultInfo =
        document.getElementById(
          "searchResultInfo"
        );
      if (query) {
        clearButton.style.display =
          "flex";
      } else {
        clearButton.style.display =
          "none";
      }
      /*
       * No search:
       * display everything.
       */
      if (!query) {
        renderCompanies(
          allCompanies
        );
        resultInfo.textContent =
          "";
        return;
      }
      let matchingApplications = 0;
      const filteredCompanies =
        allCompanies
          .map(
            (company) => {
              const applications =
                Array.isArray(
                  company.applications
                )
                  ? company.applications
                  : [];
              const matching =
                applications.filter(
                  (app) => {
                    const product =
                      String(
                        app.product ||
                        app.name ||
                        ""
                      )
                        .toLowerCase();
                    return product.includes(
                      query
                    );
                  }
                );
              matchingApplications +=
                matching.length;
              if (
                matching.length === 0
              ) {
                return null;
              }
              return {
                ...company,
                applications:
                  matching
              };
            }
          )
          .filter(Boolean);
      renderCompanies(
        filteredCompanies
      );
      resultInfo.textContent =
        matchingApplications === 0
          ? "No products found."
          : `${matchingApplications} matching application${
              matchingApplications === 1
                ? ""
                : "s"
            } found`;
    }
    /*
     * Update summary numbers.
     */
    function updateSummary(
      companies
    ) {
      let totalApplications = 0;
      let approved = 0;
      let inProgress = 0;
      companies.forEach(
        (company) => {
          const applications =
            Array.isArray(
              company.applications
            )
              ? company.applications
              : [];
          totalApplications +=
            applications.length;
          applications.forEach(
            (app) => {
              const status =
                String(
                  app.currentStatus ||
                  ""
                ).toLowerCase();
              if (
                status.includes(
                  "approved"
                )
              ) {
                approved++;
              } else {
                inProgress++;
              }
            }
          );
        }
      );
      document.getElementById(
        "totalApplications"
      ).textContent =
        totalApplications;
      document.getElementById(
        "inProgress"
      ).textContent =
        inProgress;
      document.getElementById(
        "approved"
      ).textContent =
        approved;
      document.getElementById(
        "totalCompanies"
      ).textContent =
        companies.length;
    }
    async function loadData() {
      try {
        const response =
          await fetch(
            DATA_URL +
            "?t=" +
            Date.now(),
            {
              cache: "no-store"
            }
          );
        if (!response.ok) {
          throw new Error(
            "Could not load data.json"
          );
        }
        const data =
          await response.json();
        allCompanies =
          normalizeCompanies(
            data
          );
        updateSummary(
          allCompanies
        );
        /*
         * Render using the current
         * search value so a refresh
         * doesn't cancel the search.
         */
        searchProducts();
        if (
          data.updatedAt
        ) {
          document.getElementById(
            "lastUpdated"
          ).textContent =
            "NAPAMS data updated: " +
            new Date(
              data.updatedAt
            ).toLocaleString();
        } else {
          document.getElementById(
            "lastUpdated"
          ).textContent =
            "Dashboard refreshed: " +
            new Date().toLocaleString();
        }
        document.getElementById(
          "error"
        ).innerHTML = "";
      } catch (error) {
        console.error(
          "Dashboard error:",
          error
        );
        document.getElementById(
          "error"
        ).innerHTML = `
          <div class="error">
            Unable to load the latest
            application data.
          </div>
        `;
      }
    }
    /*
     * Search while typing.
     */
    document.getElementById(
      "productSearch"
    ).addEventListener(
      "input",
      searchProducts
    );
    /*
     * Clear search.
     */
    document.getElementById(
      "clearSearch"
    ).addEventListener(
      "click",
      () => {
        const input =
          document.getElementById(
            "productSearch"
          );
        input.value = "";
        searchProducts();
        input.focus();
      }
    );
    loadData();
    setInterval(
      loadData,
      REFRESH_INTERVAL
    );
  </script>
</body>
</html>
