<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAPAMS Monitor</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6fa;
      color: #1f2937;
    }
    .header {
      background: white;
      padding: 35px 7%;
      border-bottom: 1px solid #e5e7eb;
    }
    .header h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 800;
    }
    .header p {
      margin: 12px 0 0;
      color: #6b7280;
      font-size: 21px;
    }
    .container {
      width: 86%;
      max-width: 1200px;
      margin: 35px auto;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      margin-bottom: 35px;
    }
    .summary-card {
      background: white;
      border: 1px solid #e1e5eb;
      border-radius: 22px;
      padding: 30px;
    }
    .summary-title {
      color: #6b7280;
      font-size: 18px;
      margin-bottom: 18px;
    }
    .summary-number {
      font-size: 48px;
      font-weight: 800;
    }
    /*
     * ==========================================================
     * COMPANY GROUP
     * ==========================================================
     */
    .company-group {
      margin-bottom: 35px;
    }
    .company-header {
      background: white;
      border: 1px solid #e1e5eb;
      border-radius: 22px 22px 0 0;
      padding: 24px 30px;
      border-bottom: 3px solid #eef1f5;
    }
    .company-name {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
      text-transform: uppercase;
      color: #1f2937;
    }
    .company-count {
      margin-top: 7px;
      color: #6b7280;
      font-size: 15px;
    }
    .company-applications {
      background: #eef1f5;
      padding: 18px;
      border-radius: 0 0 22px 22px;
    }
    .application-card {
      background: white;
      border: 1px solid #e1e5eb;
      border-radius: 24px;
      padding: 30px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
    }
    .application-card:last-child {
      margin-bottom: 0;
    }
    .application-name {
      font-size: 27px;
      font-weight: 800;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .application-number {
      color: #6b7280;
      font-size: 16px;
      margin-bottom: 20px;
    }
    .application-number strong {
      color: #374151;
    }
    .current-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .current-status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .current-status-yellow {
      background: #fff0c2;
      color: #9a4d00;
    }
    .current-status-red {
      background: #ffe1e1;
      color: #b42323;
    }
    .current-status-green {
      background: #dff5df;
      color: #087508;
    }
    .status-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
    }
    /*
     * ==========================================================
     * STATUS TIMELINE
     * ==========================================================
     */
    .stage-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      width: 100%;
      gap: 9px 0;
      overflow: hidden;
    }
    .stage-item {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      max-width: 100%;
    }
    .stage-connector {
      width: 22px;
      height: 2px;
      background: #d5dae1;
      margin: 0 6px;
      flex-shrink: 0;
    }
    .stage-dot {
      width: 23px;
      height: 23px;
      min-width: 23px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 9px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .stage-name {
      margin-left: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #4b5563;
      white-space: nowrap;
    }
    /*
     * NAPAMS STATUS COLORS
     */
    .green {
      background: #008000;
    }
    .yellow {
      background: #ffb629;
    }
    .red {
      background: #ff4d4d;
    }
    .last-updated {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin: 35px 0;
    }
    .loading {
      background: white;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      color: #6b7280;
    }
    .error {
      background: #ffe1e1;
      color: #a00000;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
    }
    /*
     * ==========================================================
     * MOBILE
     * ==========================================================
     */
    @media (max-width: 700px) {
      .header {
        padding: 25px 6%;
      }
      .header h1 {
        font-size: 31px;
      }
      .header p {
        font-size: 17px;
      }
      .container {
        width: 92%;
        margin-top: 25px;
      }
      .summary {
        grid-template-columns: 1fr;
        gap: 15px;
      }
      .summary-card {
        padding: 23px;
      }
      .summary-number {
        font-size: 40px;
      }
      .company-header {
        padding: 22px;
      }
      .company-name {
        font-size: 22px;
      }
      .company-applications {
        padding: 12px;
      }
      .application-card {
        padding: 22px;
        border-radius: 20px;
      }
      .application-name {
        font-size: 22px;
      }
      .application-number {
        font-size: 14px;
      }
      .current-status {
        font-size: 14px;
        padding: 10px 15px;
      }
      .status-title {
        font-size: 18px;
      }
      .stage-container {
        gap: 10px 0;
      }
      .stage-connector {
        width: 10px;
        margin: 0 4px;
      }
      .stage-dot {
        width: 22px;
        height: 22px;
        min-width: 22px;
        font-size: 8px;
      }
      .stage-name {
        font-size: 9px;
        margin-left: 4px;
      }
    }
    @media (max-width: 430px) {
      .company-name {
        font-size: 20px;
      }
      .stage-name {
        font-size: 8px;
      }
      .stage-dot {
        width: 20px;
        height: 20px;
        min-width: 20px;
      }
      .stage-connector {
        width: 7px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>NAPAMS Monitor</h1>
    <p>Application status dashboard</p>
  </div>
  <div class="container">
<div id="error"></div>
<div class="summary">
  <div class="summary-card">
    <div class="summary-title">
      Total Applications
    </div>
    <div
      class="summary-number"
      id="totalApplications"
    >
      0
    </div>
  </div>
  <div class="summary-card">
    <div class="summary-title">
      In Progress
    </div>
    <div
      class="summary-number"
      id="inProgress"
    >
      0
    </div>
  </div>
  <div class="summary-card">
    <div class="summary-title">
      Approved
    </div>
    <div
      class="summary-number"
      id="approved"
    >
      0
    </div>
  </div>
</div>
<div id="applications">
  <div class="loading">
    Loading applications...
  </div>
</div>
<div
  class="last-updated"
  id="lastUpdated"
>
  Loading latest update...
</div>
  </div>
  <script>
    const DATA_URL = "./data.json";
    /*
     * The dashboard refreshes every minute.
     */
    const REFRESH_INTERVAL =
      60 * 1000;
    /*
     * ==========================================================
     * SECURITY
     * ==========================================================
     */
    function escapeHtml(value) {
      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }
    /*
     * ==========================================================
     * COLORS
     * ==========================================================
     */
    function colorClass(color) {
      const normalized =
        String(
          color || ""
        ).toUpperCase();
      if (
        normalized === "GREEN"
      ) {
        return "green";
      }
      if (
        normalized === "YELLOW"
      ) {
        return "yellow";
      }
      return "red";
    }
    function currentStatusClass(color) {
      const normalized =
        String(
          color || ""
        ).toUpperCase();
      if (
        normalized === "GREEN"
      ) {
        return "current-status-green";
      }
      if (
        normalized === "YELLOW"
      ) {
        return "current-status-yellow";
      }
      return "current-status-red";
    }
    /*
     * ==========================================================
     * CURRENT STATUS COLOR
     * ==========================================================
     */
    function getCurrentStatusColor(app) {
      const stages =
        Array.isArray(
          app.stages
        )
          ? app.stages
          : [];
      const currentStatus =
        String(
          app.currentStatus || ""
        )
          .trim()
          .toLowerCase();
      /*
       * First use the stage matching
       * the current status.
       */
      const matchingStage =
        stages.find(
          (stage) =>
            String(
              stage.name ||
              stage.trackingStageName ||
              ""
            )
              .trim()
              .toLowerCase() ===
            currentStatus
        );
      if (
        matchingStage
      ) {
        return (
          matchingStage.color ||
          "YELLOW"
        );
      }
      return (
        app.currentStatusColor ||
        "YELLOW"
      );
    }
    /*
     * ==========================================================
     * GROUP APPLICATIONS BY COMPANY
     * ==========================================================
     */
    function groupByCompany(
      applications
    ) {
      const groups = {};
      applications.forEach(
        (app) => {
          const company =
            String(
              app.companyName ||
              "Unknown Company"
            ).trim();
          if (
            !groups[company]
          ) {
            groups[company] = [];
          }
          groups[company].push(
            app
          );
        }
      );
      return groups;
    }
    /*
     * ==========================================================
     * RENDER ONE APPLICATION
     * ==========================================================
     */
    function renderApplication(
      app
    ) {
      const stages =
        Array.isArray(
          app.stages
        )
          ? app.stages
          : [];
      const currentColor =
        getCurrentStatusColor(
          app
        );
      const card =
        document.createElement(
          "div"
        );
      card.className =
        "application-card";
      const stageHTML =
        stages
          .map(
            (
              stage,
              index
            ) => {
              const stageColor =
                stage.color ||
                "RED";
              const cssColor =
                colorClass(
                  stageColor
                );
              const stageName =
                stage.name ||
                stage.trackingStageName ||
                "Unknown";
              return `
                <div class="stage-item">
                  ${
                    index > 0
                      ? `
                        <div
                          class="stage-connector"
                        ></div>
                      `
                      : ""
                  }
                  <div
                    class="
                      stage-dot
                      ${cssColor}
                    "
                    title="${escapeHtml(
                      stageName
                    )}"
                  >
                    ${index + 1}
                  </div>
                  <div class="stage-name">
                    ${escapeHtml(
                      stageName
                    )}
                  </div>
                </div>
              `;
            }
          )
          .join("");
      const currentCss =
        currentStatusClass(
          currentColor
        );
      const currentDotClass =
        colorClass(
          currentColor
        );
      card.innerHTML = `
        <div class="application-name">
          ${escapeHtml(
            app.product ||
            app.name ||
            "Unknown Product"
          )}
        </div>
        <div class="application-number">
          Application Number:
          <strong>
            ${escapeHtml(
              app.applicationNumber ||
              "Unknown"
            )}
          </strong>
        </div>
        <div
          class="
            current-status
            ${currentCss}
          "
        >
          <span
            class="
              current-status-dot
              ${currentDotClass}
            "
          ></span>
          Current Status:
          <strong>
            ${escapeHtml(
              app.currentStatus ||
              "Unknown"
            )}
          </strong>
        </div>
        <div class="status-title">
          Status Stages
        </div>
        <div class="stage-container">
          ${stageHTML}
        </div>
      `;
      return card;
    }
    /*
     * ==========================================================
     * RENDER APPLICATIONS GROUPED BY COMPANY
     * ==========================================================
     */
    function renderApplications(
      applications
    ) {
      const container =
        document.getElementById(
          "applications"
        );
      container.innerHTML = "";
      if (
        !Array.isArray(
          applications
        ) ||
        applications.length === 0
      ) {
        container.innerHTML = `
          <div class="loading">
            No submitted applications found.
          </div>
        `;
        return;
      }
      const groups =
        groupByCompany(
          applications
        );
      Object.entries(
        groups
      ).forEach(
        (
          [
            companyName,
            companyApplications
          ]
        ) => {
          /*
           * Company wrapper
           */
          const companyGroup =
            document.createElement(
              "div"
            );
          companyGroup.className =
            "company-group";
          /*
           * Company header
           */
          const companyHeader =
            document.createElement(
              "div"
            );
          companyHeader.className =
            "company-header";
          companyHeader.innerHTML = `
            <h2 class="company-name">
              ${escapeHtml(
                companyName
              )}
            </h2>
            <div class="company-count">
              ${
                companyApplications.length
              }
              ${
                companyApplications.length === 1
                  ? "application"
                  : "applications"
              }
            </div>
          `;
          /*
           * Applications belonging
           * to this company.
           */
          const applicationsWrapper =
            document.createElement(
              "div"
            );
          applicationsWrapper.className =
            "company-applications";
          companyApplications.forEach(
            (app) => {
              applicationsWrapper.appendChild(
                renderApplication(
                  app
                )
              );
            }
          );
          companyGroup.appendChild(
            companyHeader
          );
          companyGroup.appendChild(
            applicationsWrapper
          );
          container.appendChild(
            companyGroup
          );
        }
      );
    }
    /*
     * ==========================================================
     * SUMMARY
     * ==========================================================
     */
    function updateSummary(
      applications
    ) {
      const total =
        applications.length;
      let approved = 0;
      let inProgress = 0;
      applications.forEach(
        (app) => {
          const status =
            String(
              app.currentStatus ||
              ""
            ).toLowerCase();
          if (
            status.includes(
              "approved"
            )
          ) {
            approved++;
          } else {
            inProgress++;
          }
        }
      );
      document.getElementById(
        "totalApplications"
      ).textContent =
        total;
      document.getElementById(
        "inProgress"
      ).textContent =
        inProgress;
      document.getElementById(
        "approved"
      ).textContent =
        approved;
    }
    /*
     * ==========================================================
     * LOAD DATA
     * ==========================================================
     */
    async function loadData() {
      try {
        const response =
          await fetch(
            DATA_URL +
            "?t=" +
            Date.now(),
            {
              cache:
                "no-store"
            }
          );
        if (
          !response.ok
        ) {
          throw new Error(
            "Could not load data.json"
          );
        }
        const data =
          await response.json();
        const applications =
          Array.isArray(
            data
          )
            ? data
            : Array.isArray(
                data.applications
              )
            ? data.applications
            : [];
        updateSummary(
          applications
        );
        renderApplications(
          applications
        );
        /*
         * Actual monitor timestamp.
         */
        if (
          data.updatedAt
        ) {
          document.getElementById(
            "lastUpdated"
          ).textContent =
            "NAPAMS data updated: " +
            new Date(
              data.updatedAt
            ).toLocaleString();
        } else {
          document.getElementById(
            "lastUpdated"
          ).textContent =
            "Dashboard refreshed: " +
            new Date().toLocaleString();
        }
        document.getElementById(
          "error"
        ).innerHTML =
          "";
      } catch (
        error
      ) {
        console.error(
          "Dashboard error:",
          error
        );
        document.getElementById(
          "error"
        ).innerHTML = `
          <div class="error">
            Unable to load the latest
            application data.
          </div>
        `;
      }
    }
    /*
     * ==========================================================
     * START
     * ==========================================================
     */
    loadData();
    setInterval(
      loadData,
      REFRESH_INTERVAL
    );
  </script>
</body>
</html>
