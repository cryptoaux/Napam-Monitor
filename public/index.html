<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NAPAMS Monitor</title>
  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
  <style>
    * {
      box-sizing: border-box;
    }
    :root {
      --primary: #14532d;
      --primary-light: #ecfdf3;
      --text: #172033;
      --muted: #6b7280;
      --border: #e5e7eb;
      --background: #f6f8fb;
      --white: #ffffff;
      --green: #16a34a;
      --green-bg: #dcfce7;
      --yellow: #f59e0b;
      --yellow-bg: #fef3c7;
      --red: #ef4444;
      --red-bg: #fee2e2;
      --shadow:
        0 8px 30px rgba(15, 23, 42, 0.06);
    }
    body {
      margin: 0;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      background: var(--background);
      color: var(--text);
    }
    /* =========================
       HEADER
    ========================= */
    .header {
      background: linear-gradient(
        135deg,
        #ffffff 0%,
        #f8fafc 100%
      );
      border-bottom: 1px solid var(--border);
      padding: 42px 7%;
    }
    .header-inner {
      max-width: 1200px;
      margin: auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .brand-icon {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: white;
      font-size: 24px;
      box-shadow:
        0 8px 18px rgba(20, 83, 45, 0.18);
    }
    .header h1 {
      margin: 0;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .header p {
      margin: 10px 0 0 69px;
      color: var(--muted);
      font-size: 16px;
    }
    /* =========================
       MAIN
    ========================= */
    .container {
      width: 86%;
      max-width: 1200px;
      margin: 35px auto 60px;
    }
    /* =========================
       SEARCH
    ========================= */
    .search-section {
      margin-bottom: 28px;
    }
    .search-box {
      position: relative;
      width: 100%;
    }
    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 18px;
      pointer-events: none;
    }
    #searchInput {
      width: 100%;
      height: 60px;
      padding: 0 55px;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: white;
      font-size: 16px;
      color: var(--text);
      outline: none;
      box-shadow: var(--shadow);
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }
    #searchInput:focus {
      border-color: #86b79a;
      box-shadow:
        0 0 0 4px rgba(22, 163, 74, 0.08),
        var(--shadow);
    }
    #searchInput::placeholder {
      color: #9ca3af;
    }
    .clear-search {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 50%;
      background: #f3f4f6;
      color: #6b7280;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .clear-search:hover {
      background: #e5e7eb;
    }
    /* =========================
       SUMMARY CARDS
       2 × 2 GRID
    ========================= */
    .summary {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 20px;
      margin-bottom: 35px;
    }
    .summary-card {
      position: relative;
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 25px;
      min-height: 145px;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }
    .summary-card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 35px rgba(15, 23, 42, 0.09);
    }
    .summary-card::after {
      content: "";
      position: absolute;
      right: -25px;
      bottom: -30px;
      width: 105px;
      height: 105px;
      border-radius: 50%;
      background: rgba(20, 83, 45, 0.04);
    }
    .summary-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .summary-title {
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .summary-icon {
      width: 43px;
      height: 43px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .summary-icon.companies {
      background: #ecfdf3;
      color: #15803d;
    }
    .summary-icon.applications {
      background: #eff6ff;
      color: #2563eb;
    }
    .summary-icon.progress {
      background: #fff7ed;
      color: #ea580c;
    }
    .summary-icon.approved {
      background: #f0fdf4;
      color: #16a34a;
    }
    .summary-number {
      position: relative;
      z-index: 2;
      font-size: 42px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1px;
    }
    /* =========================
       COMPANY
    ========================= */
    .company-section {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      margin-bottom: 28px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .company-header {
      padding: 22px 25px;
      background:
        linear-gradient(
          135deg,
          #ffffff,
          #f8fafc
        );
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      transition:
        background 0.2s ease;
    }
    .company-header:hover {
      background: #f8fafc;
    }
    .company-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .company-icon {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary-light);
      color: var(--primary);
      font-size: 19px;
    }
    .company-name {
      font-size: 19px;
      font-weight: 800;
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }
    .company-count {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
    }
    .company-arrow {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      color: #6b7280;
      transition:
        transform 0.25s ease,
        background 0.2s ease;
    }
    .company-section.open
      .company-arrow {
      transform: rotate(180deg);
      background: var(--primary-light);
      color: var(--primary);
    }
    .company-applications {
      display: none;
      padding: 20px;
    }
    .company-section.open
      .company-applications {
      display: block;
    }
    /* =========================
       APPLICATION CARD
    ========================= */
    .application-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 19px;
      padding: 24px;
      margin-bottom: 16px;
      transition:
        box-shadow 0.2s ease,
        border-color 0.2s ease;
    }
    .application-card:last-child {
      margin-bottom: 0;
    }
    .application-card:hover {
      border-color: #d1d5db;
      box-shadow:
        0 8px 25px rgba(15, 23, 42, 0.06);
    }
    .application-name {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: -0.2px;
    }
    .application-number {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 19px;
    }
    .application-number strong {
      color: #374151;
    }
    /* =========================
       CURRENT STATUS
    ========================= */
    .current-status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 25px;
    }
    .current-status strong {
      font-weight: 800;
    }
    .current-status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }
    .current-status-yellow {
      background: var(--yellow-bg);
      color: #92400e;
    }
    .current-status-red {
      background: var(--red-bg);
      color: #b91c1c;
    }
    .current-status-green {
      background: var(--green-bg);
      color: #166534;
    }
    /* =========================
       STAGES
    ========================= */
    .status-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 15px;
      color: #374151;
    }
    .stage-container {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      width: 100%;
      gap: 10px 0;
      overflow: hidden;
    }
    .stage-item {
      display: inline-flex;
      align-items: center;
      min-width: 0;
      max-width: 100%;
    }
    .stage-connector {
      width: 22px;
      height: 2px;
      background: #d5dae1;
      margin: 0 6px;
      flex-shrink: 0;
    }
    .stage-dot {
      width: 25px;
      height: 25px;
      min-width: 25px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 9px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .stage-name {
      margin-left: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #4b5563;
      white-space: nowrap;
    }
    /* =========================
       NAPAMS COLORS
    ========================= */
    .green {
      background: #16a34a;
    }
    .yellow {
      background: #f59e0b;
    }
    .red {
      background: #ef4444;
    }
    /* =========================
       EMPTY / ERROR
    ========================= */
    .loading {
      background: white;
      border-radius: 20px;
      padding: 50px 30px;
      text-align: center;
      color: var(--muted);
    }
    .loading i {
      font-size: 25px;
      margin-bottom: 12px;
    }
    .error {
      background: var(--red-bg);
      color: #991b1b;
      border: 1px solid #fecaca;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 25px;
    }
    .no-results {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 45px 25px;
      text-align: center;
      color: var(--muted);
      box-shadow: var(--shadow);
    }
    .no-results i {
      font-size: 32px;
      margin-bottom: 12px;
      color: #9ca3af;
    }
    /* =========================
       LAST UPDATED
    ========================= */
    .last-updated {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin: 35px 0;
    }
    /* =========================
       RESPONSIVE
    ========================= */
    @media (max-width: 700px) {
      .header {
        padding: 28px 6%;
      }
      .header h1 {
        font-size: 30px;
      }
      .header p {
        margin-left: 0;
        margin-top: 10px;
      }
      .brand-icon {
        width: 48px;
        height: 48px;
      }
      .container {
        width: 92%;
        margin-top: 25px;
      }
      /*
       * Keep summary cards 2 × 2
       * on mobile as requested.
       */
      .summary {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
        gap: 12px;
      }
      .summary-card {
        padding: 17px;
        min-height: 125px;
        border-radius: 17px;
      }
      .summary-top {
        margin-bottom: 15px;
      }
      .summary-title {
        font-size: 10px;
      }
      .summary-icon {
        width: 34px;
        height: 34px;
        font-size: 14px;
        border-radius: 10px;
      }
      .summary-number {
        font-size: 32px;
      }
      .search-box input {
        height: 55px;
      }
      .company-header {
        padding: 17px;
      }
      .company-name {
        font-size: 16px;
      }
      .company-count {
        font-size: 12px;
      }
      .company-applications {
        padding: 12px;
      }
      .application-card {
        padding: 18px;
      }
      .application-name {
        font-size: 18px;
      }
      .stage-container {
        gap: 10px 0;
      }
      .stage-connector {
        width: 10px;
        margin: 0 4px;
      }
      .stage-dot {
        width: 22px;
        height: 22px;
        min-width: 22px;
        font-size: 8px;
      }
      .stage-name {
        font-size: 9px;
        margin-left: 4px;
      }
    }
    @media (max-width: 430px) {
      .summary-card {
        padding: 15px;
      }
      .summary-title {
        font-size: 9px;
      }
      .summary-number {
        font-size: 28px;
      }
      .summary-icon {
        width: 31px;
        height: 31px;
        font-size: 12px;
      }
      .stage-name {
        font-size: 8px;
      }
      .stage-dot {
        width: 20px;
        height: 20px;
        min-width: 20px;
      }
      .stage-connector {
        width: 7px;
      }
    }
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-chart-line"></i>
        </div>
        <h1>NAPAMS Monitor</h1>
      </div>
      <p>
        Monitor your NAPAMS applications and approval stages
        in real time.
      </p>
    </div>
  </header>
  <main class="container">
    <!-- ERROR -->
    <div id="error"></div>
    <!-- SEARCH -->
    <section class="search-section">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input
          type="search"
          id="searchInput"
          placeholder="Search product by name..."
          autocomplete="off"
        >
        <button
          class="clear-search"
          id="clearSearch"
          type="button"
          aria-label="Clear search"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </section>
    <!-- SUMMARY -->
    <section class="summary">
      <!-- COMPANIES -->
      <div class="summary-card">
        <div class="summary-top">
          <div class="summary-title">
            Total Companies
          </div>
          <div class="summary-icon companies">
            <i class="fa-solid fa-building"></i>
          </div>
        </div>
        <div
          class="summary-number"
          id="totalCompanies"
        >
          0
        </div>
      </div>
      <!-- APPLICATIONS -->
      <div class="summary-card">
        <div class="summary-top">
          <div class="summary-title">
            Total Applications
          </div>
          <div class="summary-icon applications">
            <i class="fa-solid fa-file-lines"></i>
          </div>
        </div>
        <div
          class="summary-number"
          id="totalApplications"
        >
          0
        </div>
      </div>
      <!-- IN PROGRESS -->
      <div class="summary-card">
        <div class="summary-top">
          <div class="summary-title">
            In Progress
          </div>
          <div class="summary-icon progress">
            <i class="fa-solid fa-spinner"></i>
          </div>
        </div>
        <div
          class="summary-number"
          id="inProgress"
        >
          0
        </div>
      </div>
      <!-- APPROVED -->
      <div class="summary-card">
        <div class="summary-top">
          <div class="summary-title">
            Approved
          </div>
          <div class="summary-icon approved">
            <i class="fa-solid fa-circle-check"></i>
          </div>
        </div>
        <div
          class="summary-number"
          id="approved"
        >
          0
        </div>
      </div>
    </section>
    <!-- APPLICATIONS -->
    <div id="applications">
      <div class="loading">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <div>
          Loading applications...
        </div>
      </div>
    </div>
    <!-- LAST UPDATED -->
    <div
      class="last-updated"
      id="lastUpdated"
    >
      Loading latest update...
    </div>
  </main>
  <script>
    const DATA_URL = "./data.json";
    const REFRESH_INTERVAL =
      60 * 1000;
    let allCompanies = [];
    let currentSearch = "";
    /* =========================
       SECURITY
    ========================= */
    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
    /* =========================
       COLORS
    ========================= */
    function colorClass(color) {
      if (
        String(color).toUpperCase() ===
        "GREEN"
      ) {
        return "green";
      }
      if (
        String(color).toUpperCase() ===
        "YELLOW"
      ) {
        return "yellow";
      }
      return "red";
    }
    function currentStatusClass(color) {
      if (
        String(color).toUpperCase() ===
        "GREEN"
      ) {
        return "current-status-green";
      }
      if (
        String(color).toUpperCase() ===
        "YELLOW"
      ) {
        return "current-status-yellow";
      }
      return "current-status-red";
    }
    /* =========================
       CURRENT STATUS COLOR
    ========================= */
    function getCurrentStatusColor(app) {
      const stages =
        Array.isArray(app.stages)
          ? app.stages
          : [];
      const currentStatus =
        String(
          app.currentStatus || ""
        )
          .trim()
          .toLowerCase();
      const matchingStage =
        stages.find(
          stage =>
            String(
              stage.name ||
              stage.trackingStageName ||
              ""
            )
              .trim()
              .toLowerCase() ===
            currentStatus
        );
      if (matchingStage) {
        return (
          matchingStage.color ||
          "YELLOW"
        );
      }
      return (
        app.currentStatusColor ||
        "YELLOW"
      );
    }
    /* =========================
       NORMALIZE DATA
    ========================= */
    function normalizeCompanies(data) {
      /*
       * New format:
       *
       * {
       *   companies: [
       *     {
       *       name: "...",
       *       applications: [...]
       *     }
       *   ]
       * }
       */
      if (
        data &&
        Array.isArray(data.companies)
      ) {
        return data.companies;
      }
      /*
       * Backwards compatibility:
       *
       * If monitor still sends:
       *
       * {
       *   applications: [...]
       * }
       *
       * group applications by company.
       */
      const applications =
        Array.isArray(data)
          ? data
          : (
              data &&
              Array.isArray(
                data.applications
              )
            )
              ? data.applications
              : [];
      const groups = {};
      applications.forEach(app => {
        const company =
          app.companyName ||
          app.company ||
          "Unknown Company";
        if (!groups[company]) {
          groups[company] = [];
        }
        groups[company].push(app);
      });
      return Object.keys(groups)
        .map(name => ({
          name,
          applications:
            groups[name]
        }));
    }
    /* =========================
       SEARCH
    ========================= */
    function searchCompanies() {
      const query =
        currentSearch
          .trim()
          .toLowerCase();
      if (!query) {
        renderCompanies(
          allCompanies
        );
        return;
      }
      const filtered =
        allCompanies
          .map(company => {
            const applications =
              Array.isArray(
                company.applications
              )
                ? company.applications
                : [];
            const matches =
              applications.filter(app => {
                const product =
                  String(
                    app.product ||
                    app.name ||
                    ""
                  )
                    .toLowerCase();
                return product.includes(
                  query
                );
              });
            if (
              matches.length === 0
            ) {
              return null;
            }
            return {
              ...company,
              applications:
                matches
            };
          })
          .filter(Boolean);
      renderCompanies(filtered);
    }
    /* =========================
       RENDER COMPANIES
    ========================= */
    function renderCompanies(
      companies
    ) {
      const container =
        document.getElementById(
          "applications"
        );
      container.innerHTML = "";
      if (
        !Array.isArray(companies) ||
        companies.length === 0
      ) {
        container.innerHTML = `
          <div class="no-results">
            <i class="fa-solid fa-magnifying-glass"></i>
            <div>
              No products found.
            </div>
          </div>
        `;
        return;
      }
      companies.forEach(
        (company, companyIndex) => {
          const applications =
            Array.isArray(
              company.applications
            )
              ? company.applications
              : [];
          if (
            applications.length === 0
          ) {
            return;
          }
          const section =
            document.createElement(
              "section"
            );
          section.className =
            "company-section";
          /* COMPANY HEADER */
          const header =
            document.createElement(
              "div"
            );
          header.className =
            "company-header";
          header.innerHTML = `
            <div class="company-left">
              <div class="company-icon">
                <i class="fa-solid fa-building"></i>
              </div>
              <div>
                <div class="company-name">
                  ${escapeHtml(
                    company.name ||
                    company.companyName ||
                    "Unknown Company"
                  )}
                </div>
                <div class="company-count">
                  ${
                    applications.length
                  }
                  ${
                    applications.length === 1
                      ? "application"
                      : "applications"
                  }
                </div>
              </div>
            </div>
            <div class="company-arrow">
              <i class="fa-solid fa-chevron-down"></i>
            </div>
          `;
          /* APPLICATIONS */
          const appsContainer =
            document.createElement(
              "div"
            );
          appsContainer.className =
            "company-applications";
          applications.forEach(
            app => {
              appsContainer.appendChild(
                createApplicationCard(
                  app
                )
              );
            }
          );
          /* DROPDOWN */
          header.addEventListener(
            "click",
            () => {
              section.classList.toggle(
                "open"
              );
            }
          );
          section.appendChild(
            header
          );
          section.appendChild(
            appsContainer
          );
          container.appendChild(
            section
          );
        }
      );
    }
    /* =========================
       APPLICATION CARD
    ========================= */
    function createApplicationCard(
      app
    ) {
      const card =
        document.createElement(
          "div"
        );
      card.className =
        "application-card";
      const stages =
        Array.isArray(
          app.stages
        )
          ? app.stages
          : [];
      const currentColor =
        getCurrentStatusColor(
          app
        );
      const stageHTML =
        stages
          .map(
            (stage, index) => {
              const stageColor =
                stage.color ||
                "RED";
              const cssColor =
                colorClass(
                  stageColor
                );
              const stageName =
                stage.name ||
                stage.trackingStageName ||
                "Unknown";
              return `
                <div class="stage-item">
                  ${
                    index > 0
                      ? `
                        <div
                          class="stage-connector"
                        ></div>
                      `
                      : ""
                  }
                  <div
                    class="
                      stage-dot
                      ${cssColor}
                    "
                    title="${escapeHtml(
                      stageName
                    )}"
                  >
                    ${index + 1}
                  </div>
                  <div class="stage-name">
                    ${escapeHtml(
                      stageName
                    )}
                  </div>
                </div>
              `;
            }
          )
          .join("");
      const currentCss =
        currentStatusClass(
          currentColor
        );
      const currentDotClass =
        colorClass(
          currentColor
        );
      card.innerHTML = `
        <div class="application-name">
          ${escapeHtml(
            app.product ||
            app.name ||
            "Unknown Product"
          )}
        </div>
        <div class="application-number">
          Application Number:
          <strong>
            ${escapeHtml(
              app.applicationNumber ||
              "Unknown"
            )}
          </strong>
        </div>
        <div
          class="
            current-status
            ${currentCss}
          "
        >
          <span
            class="
              current-status-dot
              ${currentDotClass}
            "
          ></span>
          Current Status:
          <strong>
            ${escapeHtml(
              app.currentStatus ||
              "Unknown"
            )}
          </strong>
        </div>
        <div class="status-title">
          Status Stages
        </div>
        <div class="stage-container">
          ${stageHTML}
        </div>
      `;
      return card;
    }
    /* =========================
       SUMMARY
    ========================= */
    function updateSummary(
      companies
    ) {
      const totalCompanies =
        companies.length;
      let totalApplications = 0;
      let approved = 0;
      let inProgress = 0;
      companies.forEach(
        company => {
          const applications =
            Array.isArray(
              company.applications
            )
              ? company.applications
              : [];
          totalApplications +=
            applications.length;
          applications.forEach(
            app => {
              const status =
                String(
                  app.currentStatus ||
                  ""
                )
                  .toLowerCase();
              if (
                status.includes(
                  "approved"
                )
              ) {
                approved++;
              } else {
                inProgress++;
              }
            }
          );
        }
      );
      document.getElementById(
        "totalCompanies"
      ).textContent =
        totalCompanies;
      document.getElementById(
        "totalApplications"
      ).textContent =
        totalApplications;
      document.getElementById(
        "inProgress"
      ).textContent =
        inProgress;
      document.getElementById(
        "approved"
      ).textContent =
        approved;
    }
    /* =========================
       LOAD DATA
    ========================= */
    async function loadData() {
      try {
        const response =
          await fetch(
            DATA_URL +
            "?t=" +
            Date.now(),
            {
              cache: "no-store"
            }
          );
        if (!response.ok) {
          throw new Error(
            "Could not load data.json"
          );
        }
        const data =
          await response.json();
        allCompanies =
          normalizeCompanies(
            data
          );
        updateSummary(
          allCompanies
        );
        searchCompanies();
        if (
          data &&
          data.updatedAt
        ) {
          document.getElementById(
            "lastUpdated"
          ).textContent =
            "NAPAMS data updated: " +
            new Date(
              data.updatedAt
            ).toLocaleString();
        } else {
          document.getElementById(
            "lastUpdated"
          ).textContent =
            "Dashboard refreshed: " +
            new Date().toLocaleString();
        }
        document.getElementById(
          "error"
        ).innerHTML = "";
      } catch (error) {
        console.error(
          "Dashboard error:",
          error
        );
        document.getElementById(
          "error"
        ).innerHTML = `
          <div class="error">
            <i class="fa-solid fa-triangle-exclamation"></i>
            Unable to load the latest
            application data.
          </div>
        `;
      }
    }
    /* =========================
       SEARCH EVENTS
    ========================= */
    const searchInput =
      document.getElementById(
        "searchInput"
      );
    const clearSearch =
      document.getElementById(
        "clearSearch"
      );
    searchInput.addEventListener(
      "input",
      () => {
        currentSearch =
          searchInput.value;
        clearSearch.style.display =
          currentSearch.length > 0
            ? "flex"
            : "none";
        searchCompanies();
      }
    );
    clearSearch.addEventListener(
      "click",
      () => {
        searchInput.value = "";
        currentSearch = "";
        clearSearch.style.display =
          "none";
        searchCompanies();
        searchInput.focus();
      }
    );
    /* =========================
       START
    ========================= */
    loadData();
    setInterval(
      loadData,
      REFRESH_INTERVAL
    );
  </script>
</body>
</html>
