name: NAPAMS Monitor CI

# Offline validation path for the repository.
# This workflow validates the checked-in codebase with the existing
# mocked test suite and static quality gates only.
# It does not contact the live NAPAMS site or require production secrets.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies with npm ci
        run: npm ci

      - name: Run project validation build
        run: npm run build

      - name: Run tests with coverage thresholds
        run: npm test

      - name: Print coverage summary
        run: npx c8 report --reporter=text --reporter=text-summary

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate JavaScript syntax
        run: npm run check:syntax

      - name: Run JavaScript typecheck
        run: npm run typecheck

      - name: Run dependency audit
        run: npm audit --audit-level=high

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Validate Terraform formatting
        run: terraform fmt -check -recursive terraform

      - name: Initialize Terraform without a backend
        run: terraform -chdir=terraform/environments/production init -backend=false

      - name: Validate Terraform configuration
        run: terraform -chdir=terraform/environments/production validate

      - name: Scan Terraform with tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform
