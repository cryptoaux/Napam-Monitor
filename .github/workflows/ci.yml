name: NAPAMS Monitor CI

# Offline validation path for the repository.
# This workflow validates the checked-in codebase with the existing
# mocked test suite and static quality gates only.
# It does not contact the live NAPAMS site or require production secrets.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies with npm ci
        run: npm ci

      - name: Run tests with coverage thresholds
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate JavaScript syntax
        run: npm run check:syntax

      - name: Run dependency audit
        run: npm audit --audit-level=high
