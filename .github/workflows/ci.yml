name: NAPAMS Monitor CI

# CI validation / smoke path.
# This workflow validates code quality and mocked test coverage only.
# It must not perform live NAPAMS network calls or depend on production secrets.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage gate
        run: npm test

      - name: Run dependency audit
        run: npm audit --audit-level=high

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check monitor.js syntax
        run: node --check monitor.js
