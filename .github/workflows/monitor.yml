name: NAPAMS Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run NAPAMS monitor
        run: npm run monitor
        env:
          NAPAMS_TIN: ${{ secrets.NAPAMS_TIN }}
          NAPAMS_PASSWORD: ${{ secrets.NAPAMS_PASSWORD }}
