name: NAPAMS Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run NAPAMS monitor
        run: npm run monitor
        env:
          NAPAMS_TIN: ${{ secrets.NAPAMS_TIN }}
          NAPAMS_PASSWORD: ${{ secrets.NAPAMS_PASSWORD }}

      - name: Check generated data
        run: |
          echo "Checking for public/data.json..."
          ls -la public
          test -f public/data.json

      - name: Save latest application data
        run: |
          git config user.name "NAPAMS Monitor"
          git config user.email "actions@github.com"

          git add public/data.json

          if git diff --cached --quiet; then
            echo "No application data changes."
          else
            git commit -m "Update NAPAMS application status"
            git push
          fi
