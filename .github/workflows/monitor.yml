name: NAPAMS Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run NAPAMS monitor
        env:
          COMPANY_1_TIN: ${{ secrets.COMPANY_1_TIN }}
          COMPANY_1_PASSWORD: ${{ secrets.COMPANY_1_PASSWORD }}
          COMPANY_2_TIN: ${{ secrets.COMPANY_2_TIN }}
          COMPANY_2_PASSWORD: ${{ secrets.COMPANY_2_PASSWORD }}
          COMPANY_3_TIN: ${{ secrets.COMPANY_3_TIN }}
          COMPANY_3_PASSWORD: ${{ secrets.COMPANY_3_PASSWORD }}
        run: npm run monitor

      - name: Show generated data summary
        if: always()
        run: |
          if [ -f public/data.json ]; then
            echo "public/data.json was created successfully."
            echo "File size:"
            wc -c public/data.json
          else
            echo "public/data.json was not created."
          fi
