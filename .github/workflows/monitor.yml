name: NAPAMS Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test NAPAMS connectivity
        run: |
          echo "========================================"
          echo "TESTING NAPAMS CONNECTIVITY"
          echo "========================================"

          echo "DNS lookup:"
          getent hosts registration.nafdac.gov.ng || true

          echo ""
          echo "Testing HTTPS connection:"
          curl -I -L --max-time 30 \
            --connect-timeout 15 \
            https://registration.nafdac.gov.ng/

          echo ""
          echo "NAPAMS connectivity test completed."

      - name: Run NAPAMS monitor
        run: npm run monitor
        env:
          # Company 1
          COMPANY_1_TIN: ${{ secrets.COMPANY_1_TIN }}
          COMPANY_1_PASSWORD: ${{ secrets.COMPANY_1_PASSWORD }}

          # Company 2
          COMPANY_2_TIN: ${{ secrets.COMPANY_2_TIN }}
          COMPANY_2_PASSWORD: ${{ secrets.COMPANY_2_PASSWORD }}

          # Company 3
          COMPANY_3_TIN: ${{ secrets.COMPANY_3_TIN }}
          COMPANY_3_PASSWORD: ${{ secrets.COMPANY_3_PASSWORD }}

          # More companies can be added here later.

      - name: Check generated data
        run: |
          echo "Checking for public/data.json..."
          ls -la public
          test -f public/data.json

      - name: Save latest application data
        run: |
          git config user.name "NAPAMS Monitor"
          git config user.email "actions@github.com"

          git add public/data.json

          if git diff --cached --quiet; then
            echo "No application data changes."
          else
            git commit -m "Update NAPAMS application status"
            git push
          fi
